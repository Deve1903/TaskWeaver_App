services:
  - type: web
    name: taskweaver
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: taskweaver-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
    buildFilter:
      paths:
      - package.json
      - package-lock.json
      - server.js
      - public/**/*
      - views/**/*
      - logs/**/*

databases:
  - name: taskweaver-db
    plan: free
    databaseName: taskweaver
    user: taskweaver_user
    ipAllowList: []
    postgresMajorVersion: 15