<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskWeaver - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .reset-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            background: white;
        }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .btn-reset {
            background: linear-gradient(145deg, #6B46C1, #553C9A);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            font-weight: 600;
        }
        .password-strength {
            margin-top: 10px;
            height: 5px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        .strength-bar { height: 100%; width: 0%; transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="logo">
                <img src="logo.png" alt="TaskWeaver" onerror="this.src='https://via.placeholder.com/80/6B46C1/ffffff?text=TW'">
            </div>
            <h3 class="text-center mb-3">Reset Password</h3>
            <form id="resetForm">
                <div class="mb-3">
                    <label>New Password</label>
                    <input type="password" class="form-control" id="newPassword" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <small class="text-muted" id="strengthText"></small>
                </div>
                <div class="mb-3">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn-reset">Reset Password</button>
            </form>
            <div id="message" class="mt-3"></div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('message').innerHTML = '<div class="alert alert-danger">Invalid reset link</div>';
            document.getElementById('resetForm').style.display = 'none';
        }
        
        async function checkStrength(password) {
            const response = await fetch('/api/check-password-strength', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            return await response.json();
        }
        
        document.getElementById('newPassword').addEventListener('input', async (e) => {
            const strength = await checkStrength(e.target.value);
            document.getElementById('strengthBar').style.width = strength.width;
            document.getElementById('strengthBar').style.backgroundColor = strength.color;
            document.getElementById('strengthText').innerHTML = `Strength: ${strength.strength}`;
        });
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirm) {
                document.getElementById('message').innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
                return;
            }
            
            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            
            const data = await response.json();
            if (response.ok) {
                document.getElementById('message').innerHTML = '<div class="alert alert-success">Password reset successful! Redirecting...</div>';
                setTimeout(() => window.location.href = '/login.html', 2000);
            } else {
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        });
    </script>
</body>
</html>
