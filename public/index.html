<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TaskWeaver - Silk Calendar Dashboard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6B46C1;
            --primary-dark: #553C9A;
            --primary-light: #9F7AEA;
            --secondary: #48BB78;
            --danger: #F56565;
            --warning: #F6AD55;
            --info: #4299E1;
            --dark: #1A202C;
            --light: #F7FAFC;
            --gray: #718096;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            padding: 20px;
            transition: all 0.3s ease;
        }

        .funnel-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .calendar-container {
            background: white;
            border-radius: 24px;
            padding: 20px;
            height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .task-card {
            background: white;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: grab;
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
            user-select: none;
        }
        .task-card:active { cursor: grabbing; }
        .task-card:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .task-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        .task-critical { border-left-color: #dc3545; }
        .task-high { border-left-color: #fd7e14; }
        .task-medium { border-left-color: #ffc107; }
        .task-low { border-left-color: #28a745; }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            cursor: pointer;
            flex: 1;
        }
        .task-title:hover { color: var(--primary); }

        .fc-timegrid-slot {
            height: 80px !important;
            min-height: 80px !important;
        }
        
        .fc-timegrid-slot-label {
            font-size: 13px;
            font-weight: 600;
        }
        
        .fc-timegrid-axis {
            background: #f8f9fa;
        }
        
        .fc-event {
            cursor: pointer;
            border-radius: 8px !important;
            border: none !important;
            padding: 8px 12px !important;
            font-size: 0.85rem !important;
            font-weight: 500;
            transition: all 0.2s ease;
            margin: 2px 4px !important;
            white-space: normal !important;
            overflow: visible !important;
        }
        .fc-event:hover {
            transform: scale(1.02);
            filter: brightness(0.95);
        }
        
        .fc-daygrid-day, .fc-timegrid-slot {
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .fc-timegrid-slot:hover {
            background: rgba(107, 70, 193, 0.1) !important;
        }
        
        .fc-day-today {
            background: rgba(107, 70, 193, 0.08) !important;
        }
        
        .fc-header-toolbar {
            margin-bottom: 1.5em !important;
            padding: 10px 0;
            background: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .fc-col-header-cell {
            background: #f8f9fa;
            padding: 12px 0 !important;
            font-weight: 600;
        }

        .quick-add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(107, 70, 193, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .quick-add-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(107, 70, 193, 0.5);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(107, 70, 193, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.85rem;
            transition: all 0.2s;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 280px;
            animation: slideInRight 0.3s ease-out;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .severity-Critical { background: #dc3545; color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .severity-High { background: #fd7e14; color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .severity-Medium { background: #ffc107; color: black; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .severity-Low { background: #28a745; color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 10px; }
        
        .schedule-popup-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .btn-schedule-sm {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 20px;
        }
        
        .share-link {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }
        
        .stats-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .stats-number {
            font-size: 28px;
            font-weight: bold;
        }
        
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        
        #mainContent {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <div id="mainContent">
        <div class="container-fluid p-3">
            <!-- Header -->
            <div class="row mb-3">
                <div class="col-12">
                    <div class="glass-card d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div style="width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-tasks" style="color: white; font-size: 24px;"></i>
                            </div>
                            <div>
                                <h2 class="mb-0" 
                                    style="background: linear-gradient(135deg, #667eea, #764ba2); 
                                           -webkit-background-clip: text; 
                                           -webkit-text-fill-color: transparent; 
                                           background-clip: text; 
                                           color: transparent;">
                                    TaskWeaver
                                </h2>
                                <small class="text-muted">Silk Calendar & Task Funnel</small>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <button class="btn btn-outline-primary btn-sm" onclick="openShareModal()">
                                <i class="fas fa-share-alt"></i> Share Schedule
                            </button>
                            <button class="btn btn-outline-success btn-sm" onclick="openExportModal()">
                                <i class="fas fa-download"></i> Export
                            </button>
                            <button class="btn btn-outline-info btn-sm" onclick="viewStats()">
                                <i class="fas fa-chart-line"></i> Stats
                            </button>
                            <button class="btn btn-outline-primary btn-sm" onclick="openSettingsModal()">
                                <i class="fas fa-cog"></i> Settings
                            </button>
                            <div id="userDisplay" class="fw-bold"></div>
                            <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Exit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Left Sidebar - Task Funnel -->
                <div class="col-md-4">
                    <div class="funnel-container">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5><i class="fas fa-funnel-dollar me-2"></i>Task Funnel</h5>
                            <small class="text-muted">Drag to calendar | Click 📅 to schedule</small>
                        </div>
                        
                        <!-- Filters -->
                        <div class="mb-3">
                            <div class="d-flex flex-wrap">
                                <button class="filter-btn active" data-filter="all">All</button>
                                <button class="filter-btn" data-filter="Critical">🔴 Critical</button>
                                <button class="filter-btn" data-filter="High">🟠 High</button>
                                <button class="filter-btn" data-filter="Medium">🟡 Medium</button>
                                <button class="filter-btn" data-filter="Low">🟢 Low</button>
                                <button class="filter-btn" data-filter="Work">💼 Work</button>
                                <button class="filter-btn" data-filter="Study">📚 Study</button>
                                <button class="filter-btn" data-filter="Family">👨‍👩‍👧 Family</button>
                            </div>
                        </div>
                        
                        <div id="funnelTasksList"></div>
                    </div>
                </div>

                <!-- Right Side - Calendar -->
                <div class="col-md-8">
                    <div class="calendar-container">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Add Button -->
    <button class="quick-add-btn" onclick="openQuickAddModal()"><i class="fas fa-plus"></i></button>

    <!-- Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title" id="taskModalTitle">Task Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="taskModalBody"></div>
                <div class="modal-footer">
                    <button class="btn btn-outline-primary" onclick="openSchedulePopupFromModal()"><i class="fas fa-calendar-plus"></i> Schedule to Calendar</button>
                    <button class="btn btn-outline-danger" onclick="moveTaskToFunnel()"><i class="fas fa-arrow-left"></i> Move to Funnel</button>
                    <button class="btn btn-success" onclick="completeCurrentTask()"><i class="fas fa-check-circle"></i> Complete</button>
                    <button class="btn btn-danger" onclick="deleteCurrentTask()"><i class="fas fa-trash"></i> Delete</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Schedule Popup Modal -->
    <div class="modal fade" id="schedulePopupModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title"><i class="fas fa-calendar-alt me-2"></i>Schedule Task to Calendar</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="scheduleTaskTitle" class="fw-bold mb-3"></p>
                    <div class="mb-3">
                        <label class="form-label">Start Date & Time (24h format)</label>
                        <input type="datetime-local" class="form-control" id="scheduleStartTime" step="900">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">End Date & Time (24h format)</label>
                        <input type="datetime-local" class="form-control" id="scheduleEndTime" step="900">
                    </div>
                    <div class="schedule-popup-buttons">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-primary" onclick="confirmScheduleFromPopup()"><i class="fas fa-check"></i> Confirm Schedule</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Add New Task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="quickTaskForm">
                        <div class="mb-3">
                            <label class="form-label">Task Title *</label>
                            <input type="text" class="form-control" id="quickTaskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="quickTaskDesc" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Project</label>
                                <input type="text" class="form-control" id="quickTaskProject" placeholder="Project name">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-control" id="quickTaskCategory">
                                    <option value="Work">💼 Work</option>
                                    <option value="Study">📚 Study</option>
                                    <option value="Family">👨‍👩‍👧 Family</option>
                                    <option value="Rest">😴 Rest</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Severity</label>
                                <select class="form-control" id="quickTaskSeverity">
                                    <option value="Low">🟢 Low</option>
                                    <option value="Medium" selected>🟡 Medium</option>
                                    <option value="High">🟠 High</option>
                                    <option value="Critical">🔴 Critical</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Deadline</label>
                                <input type="datetime-local" class="form-control" id="quickTaskDeadline">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Where to place task?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="taskPlacement" value="funnel" checked> <i class="fas fa-funnel-dollar"></i> Task Funnel</label>
                                <label><input type="radio" name="taskPlacement" value="calendar"> <i class="fas fa-calendar-alt"></i> Calendar</label>
                            </div>
                        </div>
                        
                        <div id="calendarScheduleOptions" style="display: none;">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Start Date & Time</label>
                                    <input type="datetime-local" class="form-control" id="quickTaskStart">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">End Date & Time</label>
                                    <input type="datetime-local" class="form-control" id="quickTaskEnd">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="quickTaskRecurring">
                                <label class="form-check-label">Recurring Task</label>
                            </div>
                        </div>
                        <div class="mb-3" id="recurringOptions" style="display: none;">
                            <select class="form-control" id="quickTaskRecurrence">
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveQuickTask()">Add Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Schedule Modal -->
    <div class="modal fade" id="shareModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title"><i class="fas fa-share-alt me-2"></i>Share Your Schedule</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Share with (Email):</label>
                        <input type="email" class="form-control" id="shareEmail" placeholder="colleague@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Share Type:</label>
                        <select class="form-control" id="shareType">
                            <option value="view">View Only</option>
                            <option value="edit">Edit (Coming Soon)</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100" onclick="shareSchedule()">
                        <i class="fas fa-paper-plane"></i> Share Schedule
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title"><i class="fas fa-download me-2"></i>Export Schedule</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Choose your preferred format:</p>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-primary" onclick="exportSchedule('pdf')">
                            <i class="fas fa-file-pdf"></i> Export as PDF
                        </button>
                        <button class="btn btn-outline-success" onclick="exportSchedule('excel')">
                            <i class="fas fa-file-excel"></i> Export as Excel
                        </button>
                        <button class="btn btn-outline-info" onclick="exportSchedule('csv')">
                            <i class="fas fa-file-csv"></i> Export as CSV
                        </button>
                        <button class="btn btn-outline-secondary" onclick="exportSchedule('json')">
                            <i class="fas fa-code"></i> Export as JSON
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Modal -->
    <div class="modal fade" id="statsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title"><i class="fas fa-chart-line me-2"></i>Your Statistics</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="statsBody">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
                    <h5 class="modal-title"><i class="fas fa-cog me-2"></i>Settings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h6>Reminder Settings</h6>
                    <div class="mb-3">
                        <label class="form-label">Reminder Interval (minutes before task)</label>
                        <input type="number" class="form-control" id="reminderInterval" min="5" max="120" step="5" value="20">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="autoReminders">
                        <label class="form-check-label">Enable Auto Reminders</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="emailNotifications">
                        <label class="form-check-label">Email Notifications</label>
                    </div>
                    <hr>
                    <h6>Theme</h6>
                    <div class="mb-3">
                        <select class="form-control" id="themeSelect">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script>
        const API_BASE = '';
        
        let calendar;
        let allTasks = [];
        let currentTaskId = null;
        let currentFilter = 'all';
        let taskModal = null;
        let addTaskModal = null;
        let settingsModal = null;
        let schedulePopupModal = null;
        let shareModal = null;
        let exportModal = null;
        let statsModal = null;
        let pendingScheduleTaskId = null;
        let draggedTaskId = null;
        let calendarInitialized = false;
        let sessionCheckInterval = null;
        let isAuthenticated = false;

        // Simple logging
        function log(msg) {
            if (window.console) console.log(msg);
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            log('Dashboard loading...');
            
            // Check authentication first
            const authResult = await checkAuth();
            if (authResult) {
                // Show main content
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('loadingSpinner').style.display = 'none';
                
                // Initialize all components
                initCalendar();
                await loadAllTasks();
                await loadSettings();
                await loadStats();
                initFilters();
                initRecurringToggle();
                initPlacementToggle();
                
                // Initialize modals
                taskModal = new bootstrap.Modal(document.getElementById('taskModal'));
                addTaskModal = new bootstrap.Modal(document.getElementById('addTaskModal'));
                settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
                schedulePopupModal = new bootstrap.Modal(document.getElementById('schedulePopupModal'));
                shareModal = new bootstrap.Modal(document.getElementById('shareModal'));
                exportModal = new bootstrap.Modal(document.getElementById('exportModal'));
                statsModal = new bootstrap.Modal(document.getElementById('statsModal'));
                
                // Auto-refresh tasks every 30 seconds
                setInterval(async function() {
                    if (isAuthenticated) {
                        await loadAllTasks();
                    }
                }, 30000);
            }
        });

        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/api/check-session`, { 
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Session check failed');
                }
                
                const data = await response.json();
                log('Session check result:', data);
                
                if (data.authenticated) {
                    isAuthenticated = true;
                    const displayEmail = data.email || data.username;
                    document.getElementById('userDisplay').innerHTML = `<i class="fas fa-user-circle me-1"></i> ${displayEmail}`;
                    log('User authenticated:', displayEmail);
                    return true;
                } else {
                    log('Not authenticated, redirecting to login');
                    window.location.href = '/login.html';
                    return false;
                }
            } catch (error) {
                log('Auth error:', error);
                window.location.href = '/login.html';
                return false;
            }
        }

        async function loadSettings() {
            try {
                const response = await fetch(`${API_BASE}/api/settings`, { 
                    credentials: 'include',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('reminderInterval').value = data.reminder_interval || 20;
                    document.getElementById('autoReminders').checked = data.auto_reminders || false;
                    document.getElementById('emailNotifications').checked = data.email_notifications !== false;
                    document.getElementById('themeSelect').value = data.theme || 'light';
                    applyTheme(data.theme || 'light');
                }
            } catch (error) {
                log('Error loading settings:', error);
            }
        }

        async function saveSettings() {
            const settings = {
                reminder_interval: parseInt(document.getElementById('reminderInterval').value),
                auto_reminders: document.getElementById('autoReminders').checked,
                email_notifications: document.getElementById('emailNotifications').checked,
                theme: document.getElementById('themeSelect').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/settings`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(settings)
                });
                if (response.ok) {
                    applyTheme(settings.theme);
                    showNotification('Settings saved successfully!', 'success');
                    settingsModal.hide();
                }
            } catch (error) {
                showNotification('Error saving settings', 'error');
            }
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.style.background = 'linear-gradient(135deg, #1a202c 0%, #2d3748 100%)';
                document.querySelectorAll('.glass-card, .funnel-container, .calendar-container').forEach(el => {
                    el.style.background = 'rgba(26, 32, 44, 0.95)';
                    el.style.color = '#f7fafc';
                });
            } else {
                document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                document.querySelectorAll('.glass-card, .funnel-container, .calendar-container').forEach(el => {
                    el.style.background = 'rgba(255, 255, 255, 0.95)';
                    el.style.color = '#1a202c';
                });
            }
        }

                if (response.ok) {
                    const stats = await response.json();
                    window.userStats = stats;

                log('Error loading stats:', error);

        async function loadAllTasks() {
            try {
                const response = await fetch(`${API_BASE}/api/tasks`, { 
                    credentials: 'include',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Failed to load tasks');
                }
                
                allTasks = await response.json();
                log('Loaded tasks:', allTasks.length);
                
                renderFunnelTasks();
                
                if (calendar && calendarInitialized) {
                    renderCalendarEvents();
                }
            } catch (error) {
                log('Error loading tasks:', error);
                showNotification('Error loading tasks', 'error');
            }
        }

        function renderFunnelTasks() {
            const container = document.getElementById('funnelTasksList');
            const unscheduledTasks = allTasks.filter(task => {
                const hasNoSchedule = !task.scheduled_start || 
                                     task.scheduled_start === '' || 
                                     task.scheduled_start === null ||
                                     task.scheduled_start === 'null';
                const isNotCompleted = task.completed !== 1;
                return hasNoSchedule && isNotCompleted;
            });
            
            let filteredTasks = unscheduledTasks;
            if (currentFilter !== 'all') {
                filteredTasks = unscheduledTasks.filter(task => 
                    task.severity === currentFilter || task.category === currentFilter
                );
            }
            
            if (filteredTasks.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5"><i class="fas fa-check-circle fa-3x mb-2"></i><p>No tasks in funnel</p><button class="btn btn-sm btn-primary" onclick="openQuickAddModal()"><i class="fas fa-plus"></i> Add Task</button></div>`;
                return;
            }
            
            container.innerHTML = filteredTasks.map(task => `
                <div class="task-card task-${task.severity.toLowerCase()}" data-task-id="${task.id}" draggable="true">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="task-title" onclick="showTaskModalById(${task.id})">${escapeHtml(task.title)}</div>
                        <div>
                            <button class="btn btn-sm btn-outline-primary btn-schedule-sm" onclick="event.stopPropagation(); openSchedulePopupForTask(${task.id})" style="border-radius: 20px;">
                                <i class="fas fa-calendar-alt"></i> 📅
                            </button>
                            <button class="btn btn-sm btn-outline-info btn-schedule-sm" onclick="event.stopPropagation(); shareSingleTask(${task.id})" style="border-radius: 20px;">
                                <i class="fas fa-share"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-1">
                        <small class="text-muted"><i class="fas fa-folder-open"></i> ${escapeHtml(task.project) || 'No project'}</small>
                        <span class="severity-${task.severity}">${task.severity}</span>
                    </div>
                    ${task.deadline ? `<small class="text-muted"><i class="fas fa-clock"></i> Due: ${formatDate(task.deadline)}</small>` : ''}
                </div>
            `).join('');
            
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const taskCards = document.querySelectorAll('.task-card');
            taskCards.forEach(card => {
                card.setAttribute('draggable', 'true');
                card.removeEventListener('dragstart', handleDragStart);
                card.removeEventListener('dragend', handleDragEnd);
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
            });
        }

        function handleDragStart(e) {
            const taskCard = e.target.closest('.task-card');
            if (taskCard) {
                draggedTaskId = parseInt(taskCard.dataset.taskId);
                e.dataTransfer.setData('text/plain', draggedTaskId);
                e.dataTransfer.effectAllowed = 'move';
                taskCard.classList.add('dragging');
            }
        }
        
        function handleDragEnd(e) {
            const taskCard = e.target.closest('.task-card');
            if (taskCard) {
                taskCard.classList.remove('dragging');
            }
            draggedTaskId = null;
        }

        function renderCalendarEvents() {
            if (!calendar) return;
            
            calendar.removeAllEvents();
            
            const scheduledTasks = allTasks.filter(task => {
                const hasSchedule = task.scheduled_start && 
                                   task.scheduled_start !== '' && 
                                   task.scheduled_start !== null &&
                                   task.scheduled_start !== 'null';
                const isNotCompleted = task.completed !== 1;
                return hasSchedule && isNotCompleted;
            });
            
            scheduledTasks.forEach(task => {
                let startDate = new Date(task.scheduled_start);
                let endDate = task.scheduled_end ? new Date(task.scheduled_end) : new Date(startDate.getTime() + 3600000);
                
                calendar.addEvent({
                    id: task.id.toString(),
                    title: task.title,
                    start: startDate,
                    end: endDate,
                    backgroundColor: getSeverityColor(task.severity),
                    borderColor: getSeverityColor(task.severity),
                    textColor: task.severity === 'Medium' ? '#000000' : '#ffffff',
                    extendedProps: { 
                        severity: task.severity, 
                        description: task.description, 
                        task: task 
                    }
                });
            });
            
            calendar.render();
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            if (!calendarEl) return;
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'timeGridWeek,timeGridDay,dayGridMonth'
                },
                slotMinTime: '00:00:00',
                slotMaxTime: '24:00:00',
                allDaySlot: false,
                slotDuration: '01:00:00',
                slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                editable: true,
                droppable: true,
                dropAccept: '.task-card',
                dragRevertDuration: 0,
                dragScroll: true,
                nowIndicator: true,
                
                drop: async function(info) {
                    if (draggedTaskId && info.date) {
                        await scheduleTaskAtTime(draggedTaskId, info.date);
                        draggedTaskId = null;
                    }
                },
                
                eventClick: (info) => {
                    showTaskModalById(parseInt(info.event.id));
                },
                
                eventDrop: async (info) => {
                    await updateTaskSchedule(info.event.id, info.event.start, info.event.end);
                },
                
                eventResize: async (info) => {
                    await updateTaskSchedule(info.event.id, info.event.start, info.event.end);
                },
                
                dateClick: (info) => {
                    openAddTaskAtTimeModal(info.date);
                },
                
                height: 'auto',
                contentHeight: 'auto',
                aspectRatio: 1.5
            });
            
            calendar.render();
            calendarInitialized = true;
        }

        async function scheduleTaskAtTime(taskId, dateTime) {
            try {
                const startDate = new Date(dateTime);
                startDate.setMinutes(0, 0, 0);
                const endDate = new Date(startDate.getTime() + 3600000);
                const response = await fetch(`${API_BASE}/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ scheduled_start: startDate.toISOString(), scheduled_end: endDate.toISOString() })
                });
                
                if (response.ok) {
                    await loadAllTasks();
                    showNotification('Task scheduled!', 'success');
                } else {
                    showNotification('Error scheduling task', 'error');
                }
            } catch (error) {
                showNotification('Error scheduling task', 'error');
            }
        }

        async function updateTaskSchedule(taskId, startDate, endDate) {
            try {
                const response = await fetch(`${API_BASE}/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ 
                        scheduled_start: startDate ? startDate.toISOString() : null, 
                        scheduled_end: endDate ? endDate.toISOString() : null 
                    })
                });
                
                if (response.ok) {
                    await loadAllTasks();
                    showNotification(startDate ? 'Task rescheduled' : 'Task moved to funnel', 'success');
                }
            } catch (error) {
                await loadAllTasks();
                showNotification('Error rescheduling', 'error');
            }
        }

        async function moveTaskToFunnel() {
            if (currentTaskId) {
                await updateTaskSchedule(currentTaskId, null, null);
                taskModal.hide();
            }
        }

        async function saveQuickTask() {
            const placement = document.querySelector('input[name="taskPlacement"]:checked').value;
            const task = {
                title: document.getElementById('quickTaskTitle').value,
                description: document.getElementById('quickTaskDesc').value,
                project: document.getElementById('quickTaskProject').value,
                category: document.getElementById('quickTaskCategory').value,
                severity: document.getElementById('quickTaskSeverity').value,
                deadline: document.getElementById('quickTaskDeadline').value || null,
                is_recurring: document.getElementById('quickTaskRecurring').checked,
                recurrence_pattern: document.getElementById('quickTaskRecurring').checked ? document.getElementById('quickTaskRecurrence').value : null
            };
            
            if (placement === 'calendar') {
                const startDate = document.getElementById('quickTaskStart').value;
                const endDate = document.getElementById('quickTaskEnd').value;
                if (startDate && endDate) {
                    task.scheduled_start = new Date(startDate).toISOString();
                    task.scheduled_end = new Date(endDate).toISOString();
                } else {
                    showNotification('Please select start and end times', 'warning');
                    return;
                }
            }
            
            if (!task.title) {
                showNotification('Please enter a task title', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(task)
                });
                
                if (response.ok) {
                    addTaskModal.hide();
                    document.getElementById('quickTaskForm').reset();
                    await loadAllTasks();
                    showNotification('Task added!', 'success');
                } else {
                    const error = await response.json();
                    showNotification(error.error || 'Error adding task', 'error');
                }
            } catch (error) {
                showNotification('Error adding task', 'error');
            }
        }

        async function completeCurrentTask() {
            try {
                const response = await fetch(`${API_BASE}/api/tasks/${currentTaskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ completed: true })
                });
                
                if (response.ok) {
                    await loadAllTasks();
                    taskModal.hide();
                    showNotification('Task completed! 🎉', 'success');
                }
            } catch (error) {
                showNotification('Error completing task', 'error');
            }
        }

        async function deleteCurrentTask() {
            if (confirm('Are you sure you want to delete this task?')) {
                try {
                    const response = await fetch(`${API_BASE}/api/tasks/${currentTaskId}`, { method: 'DELETE', credentials: 'include' });
                    if (response.ok) {
                        await loadAllTasks();
                        taskModal.hide();
                        showNotification('Task deleted', 'success');
                    }
                } catch (error) {
                    showNotification('Error deleting task', 'error');
                }
            }
        }

            currentTaskId = task.id;
            document.getElementById('taskModalTitle').textContent = task.title;
            document.getElementById('taskModalBody').innerHTML = `
                <div class="row mb-3">
                    <div class="col-md-6"><strong>Description</strong><p>${escapeHtml(task.description) || 'No description'}</p></div>
                    <div class="col-md-6"><strong>Project</strong><p>${escapeHtml(task.project) || 'No project'}</p></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4"><strong>Category</strong><p>${escapeHtml(task.category) || 'No category'}</p></div>
                    <div class="col-md-4"><strong>Severity</strong><p><span class="severity-${task.severity}">${task.severity}</span></p></div>
                    <div class="col-md-4"><strong>Status</strong><p>${task.completed ? '<span class="badge bg-success">Completed</span>' : '<span class="badge bg-warning">Pending</span>'}</p></div>
                </div>
                ${task.deadline ? `<div class="mb-3"><strong>Deadline</strong><p>${formatDate(task.deadline)}</p></div>` : ''}
                ${task.scheduled_start ? `<div class="mb-3"><strong>Scheduled</strong><p>${formatDate(task.scheduled_start)} - ${formatDate(task.scheduled_end)}</p></div>` : '<div class="alert alert-info">This task is in the funnel. Drag it to the calendar to schedule.</div>'}

                </div>

        async function shareSchedule() {
            const shareEmail = document.getElementById('shareEmail').value;
            const shareType = document.getElementById('shareType').value;
            
            if (!shareEmail) {
                showNotification('Please enter an email address', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/share-schedule`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ shareWithEmail: shareEmail, shareType })
                });
                
                if (response.ok) {
                    showNotification(`Schedule shared with ${shareEmail}! They will receive an email with your schedule.`, 'success');
                    shareModal.hide();
                    document.getElementById('shareEmail').value = '';
                } else {
                    const error = await response.json();
                    showNotification(error.error || 'Error sharing schedule', 'error');
                }
            } catch (error) {
                showNotification('Error sharing schedule', 'error');
            }
        }

        async function shareSingleTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            
            const shareEmail = prompt(`Share "${task.title}" with (email):`);
            if (shareEmail) {
                try {
                    const response = await fetch(`${API_BASE}/api/share-schedule`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ shareWithEmail: shareEmail, shareType: 'view' })
                    });
                    
                    if (response.ok) {
                        showNotification(`Task shared with ${shareEmail}!`, 'success');
                    } else {
                        const error = await response.json();
                        showNotification(error.error || 'Error sharing task', 'error');
                    }
                } catch (error) {
                    showNotification('Error sharing task', 'error');
                }
            }
        }

        async function exportSchedule(format) {
            try {
                const response = await fetch(`${API_BASE}/api/export-schedule?format=${format}`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `taskweaver_schedule_${new Date().toISOString().split('T')[0]}.${format === 'excel' ? 'xlsx' : format}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    showNotification(`Schedule exported as ${format.toUpperCase()}`, 'success');
                    exportModal.hide();
                } else {
                    showNotification('Error exporting schedule', 'error');
                }
            } catch (error) {
                showNotification('Error exporting schedule', 'error');
            }
        }

        function openSchedulePopupForTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            pendingScheduleTaskId = taskId;
            document.getElementById('scheduleTaskTitle').innerHTML = `<i class="fas fa-tasks"></i> "${escapeHtml(task.title)}"`;
            const now = new Date();
            now.setMinutes(0, 0, 0);
            const startDefault = new Date(now.getTime() + 3600000);
            document.getElementById('scheduleStartTime').value = startDefault.toISOString().slice(0, 16);
            const endDefault = new Date(startDefault.getTime() + 3600000);
            document.getElementById('scheduleEndTime').value = endDefault.toISOString().slice(0, 16);
            schedulePopupModal.show();
        }

        function openSchedulePopupFromModal() {
            if (currentTaskId) {
                openSchedulePopupForTask(currentTaskId);
                taskModal.hide();
            }
        }

        async function confirmScheduleFromPopup() {
            if (!pendingScheduleTaskId) return;
            const startVal = document.getElementById('scheduleStartTime').value;
            const endVal = document.getElementById('scheduleEndTime').value;
            if (!startVal || !endVal) {
                showNotification('Please set start and end times', 'warning');
                return;
            }
            const startDate = new Date(startVal);
            const endDate = new Date(endVal);
            if (endDate <= startDate) {
                showNotification('End time must be after start time', 'warning');
                return;
            }
            await updateTaskSchedule(pendingScheduleTaskId, startDate, endDate);
            schedulePopupModal.hide();
            pendingScheduleTaskId = null;
        }

        function openShareModal() { shareModal.show(); }
        function openExportModal() { exportModal.show(); }
        function openSettingsModal() { settingsModal.show(); }
        
        function openQuickAddModal() {
            document.getElementById('quickTaskForm').reset();
            document.getElementById('calendarScheduleOptions').style.display = 'none';
            document.getElementById('recurringOptions').style.display = 'none';
            document.querySelector('input[value="funnel"]').checked = true;
            addTaskModal.show();
        }
        
        function openAddTaskAtTimeModal(dateTime) {
            document.getElementById('quickTaskForm').reset();
            const formattedDate = dateTime.toISOString().slice(0, 16);
            document.getElementById('quickTaskStart').value = formattedDate;
            const endDate = new Date(dateTime);
            endDate.setHours(endDate.getHours() + 1);
            document.getElementById('quickTaskEnd').value = endDate.toISOString().slice(0, 16);
            document.getElementById('quickTaskDeadline').value = formattedDate;
            document.querySelector('input[value="calendar"]').checked = true;
            document.getElementById('calendarScheduleOptions').style.display = 'block';
            addTaskModal.show();
        }

        function initPlacementToggle() {
            const radios = document.querySelectorAll('input[name="taskPlacement"]');
            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    const calendarOptions = document.getElementById('calendarScheduleOptions');
                    if (document.querySelector('input[name="taskPlacement"]:checked').value === 'calendar') {
                        calendarOptions.style.display = 'block';
                        if (!document.getElementById('quickTaskStart').value) {
                            const now = new Date();
                            now.setMinutes(0, 0, 0);
                            now.setHours(now.getHours() + 1);
                            document.getElementById('quickTaskStart').value = now.toISOString().slice(0, 16);
                            const end = new Date(now);
                            end.setHours(end.getHours() + 1);
                            document.getElementById('quickTaskEnd').value = end.toISOString().slice(0, 16);
                        }
                    } else {
                        calendarOptions.style.display = 'none';
                    }
                });
            });
        }

        function initFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderFunnelTasks();
                };
            });
        }

        function initRecurringToggle() {
            const recurringCheckbox = document.getElementById('quickTaskRecurring');
            if (recurringCheckbox) {
                recurringCheckbox.onchange = () => {
                    document.getElementById('recurringOptions').style.display = recurringCheckbox.checked ? 'block' : 'none';
                };
            }
        }

        function getSeverityColor(severity) {
            const colors = { 'Critical': '#dc3545', 'High': '#fd7e14', 'Medium': '#ffc107', 'Low': '#28a745' };
            return colors[severity] || '#6B46C1';
        }

        function formatDate(dateString) {
            if (!dateString) return 'Not set';
            return new Date(dateString).toLocaleString();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotification(message, type) {
            const toast = document.createElement('div');
            const colors = { success: '#48BB78', error: '#F56565', warning: '#F6AD55', info: '#4299E1' };
            toast.className = 'toast-notification';
            toast.innerHTML = `<div style="background: white; border-left: 4px solid ${colors[type]}; padding: 12px 20px; border-radius: 12px;"><div class="d-flex align-items-center"><i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'}" style="color: ${colors[type]}; margin-right: 12px;"></i><div>${message}</div><button class="btn-close btn-sm ms-3" onclick="this.parentElement.parentElement.parentElement.remove()"></button></div></div>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/api/logout`, { 
                    method: 'POST', 
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                isAuthenticated = false;
                window.location.href = '/login.html';
            } catch (error) {
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
